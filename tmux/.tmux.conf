# ==============================================================================
# tmux 配置文件
# ==============================================================================

# ==============================================================================
# 默认 shell
# ==============================================================================
#set -g default-shell /usr/bin/zsh

# ==============================================================================
# 鼠标滚动
# ==============================================================================
# >= version 2.1
# ==============================================================================
set -g mouse on

# ==============================================================================
# vi 模式
# ==============================================================================
set -gw mode-keys vi

# ==============================================================================
# vi 式粘贴复制
# ==============================================================================
bind Escape copy-mode
unbind p
bind p paste-buffer
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'Space' send -X halfpage-down
bind -T copy-mode-vi 'Bspace' send -X halfpage-up

# ==============================================================================
# Escape 键
# ==============================================================================
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

# ==============================================================================
# 窗口切分
# ==============================================================================
bind '"' choose-window
bind - split-window -v
bind X confirm-before -p "close window #W? (y/n)" kill-window
bind | split-window -h
unbind x

# ==============================================================================
# Pane 切换
# ==============================================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ==============================================================================
# Pane 大小调整
# ==============================================================================
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================================
# window status
# ==============================================================================
set -gw window-status-current-format '#[fg=cyan,dim]#I#[fg=blue] #[default]#W#[fg=grey,dim]'
set -gw window-status-format '#[fg=cyan,dim]#I#[fg=blue] #[default]#W#[fg=grey,dim]'

# ==============================================================================
# 状态栏
# ==============================================================================
set -g default-terminal "screen-256color"
set -g status-interval 2
set -g status-left ""
set -g status-left-length 0
set -g status-right "%Y/%m/%d %H:%M:%S"
set -g status-style bg=black,fg=green

# ==============================================================================
# 历史长度
# ==============================================================================
set -g history-limit 6553600

# ==============================================================================
# 其他
# ==============================================================================
set -g base-index 1
set -g extended-keys on
set -g visual-activity on
# escape-time 过短导致转义序列识别问题，延长为 50ms
set -gs escape-time 50
set -gw monitor-activity on
set -gw pane-base-index 1
